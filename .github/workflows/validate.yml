name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate source and defaults
        run: npm test
      - name: Restore build dependencies
        shell: powershell
        run: .\RESTORE_BUILD_DEPS.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Prepare optional signing certificate
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host "No signing certificate configured; CI will produce an unsigned validation build."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "vibe-flow-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64.Trim()))
          "VIBE_FLOW_SIGN_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build release
        shell: powershell
        env:
          VIBE_FLOW_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\BUILD_RELEASE.ps1
      - name: Remove signing certificate
        if: always()
        shell: powershell
        run: |
          if ($env:VIBE_FLOW_SIGN_PFX -and (Test-Path -LiteralPath $env:VIBE_FLOW_SIGN_PFX)) {
            Remove-Item -LiteralPath $env:VIBE_FLOW_SIGN_PFX -Force
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Vibe-Flow-Windows-v1
          path: |
            release/VibeFlow-Setup.exe
            release/Vibe-Flow-Windows-x64.zip
            release/SHA256SUMS.txt
