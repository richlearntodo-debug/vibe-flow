name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate source and defaults
        run: npm test
      - name: Restore build dependencies
        shell: powershell
        run: .\RESTORE_BUILD_DEPS.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build release
        shell: powershell
        run: .\BUILD_RELEASE.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Vibe-Flow-Windows-v1
          path: |
            release/VibeFlow-Setup.exe
            release/Vibe-Flow-Windows-x64.zip
            release/SHA256SUMS.txt
