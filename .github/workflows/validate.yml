name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate source and defaults
        run: npm test
      - name: Test installer operating-system requirements
        shell: powershell
        run: .\scripts\tests\Test-InstallerRequirements.ps1
      - name: Restore the frozen capture component
        shell: powershell
        env:
          CAPTURE_PART_1: ${{ secrets.VIBE_FLOW_CAPTURE_B64_1 }}
          CAPTURE_PART_2: ${{ secrets.VIBE_FLOW_CAPTURE_B64_2 }}
          CAPTURE_PART_3: ${{ secrets.VIBE_FLOW_CAPTURE_B64_3 }}
          CAPTURE_PART_4: ${{ secrets.VIBE_FLOW_CAPTURE_B64_4 }}
        run: |
          # The frozen capture component cannot live in the repository: .gitignore excludes *.exe, so no checkout has
          # ever contained it, and the development-runtime preparation step threw on every runner. It arrives through
          # repository secrets instead, in four base64 parts, because one secret is capped at 48 KB while the component
          # encodes to about 126 KB.
          #
          # The hash is verified here rather than trusted: a missing, truncated or wrong secret must fail loudly. The
          # point of that guard is that a runtime which is not the frozen one is never tested or packaged as if it were.
          $expected = "B62DE035A9CAD0A16B97F6935C6E4DE0BF2B73C61B180595482D852C0582E683"
          $parts = @($env:CAPTURE_PART_1, $env:CAPTURE_PART_2, $env:CAPTURE_PART_3, $env:CAPTURE_PART_4)
          $missing = @($parts | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count
          if ($missing -gt 0) {
              throw "The frozen capture secrets are not all set (VIBE_FLOW_CAPTURE_B64_1..4; $missing missing)."
          }
          $path = Join-Path $env:GITHUB_WORKSPACE "VibeMicAtvvCapture.exe"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String(($parts -join "")))
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
          if ($actual -ne $expected) {
              throw "Frozen capture SHA-256 mismatch: got $actual, expected $expected"
          }
          Write-Host "Frozen capture restored and verified: $actual"
      - name: Build and run V2 focused feature tests
        shell: powershell
        run: .\scripts\tests\Test-V2FeatureSuite.ps1
      - name: Restore build dependencies
        shell: powershell
        run: .\RESTORE_BUILD_DEPS.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Prepare optional signing certificate
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host "No signing certificate configured; CI will produce an unsigned validation build."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "vibe-flow-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64.Trim()))
          "VIBE_FLOW_SIGN_PFX=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build release
        shell: powershell
        env:
          VIBE_FLOW_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\BUILD_RELEASE.ps1
      - name: Reset the lifecycle sandbox
        shell: powershell
        run: .\scripts\tests\Reset-LifecycleSandbox.ps1
      - name: Test clean install, startup restoration, and uninstall
        shell: powershell
        run: .\scripts\Test-ReleaseLifecycle.ps1 -InstallerPath .\release\VibeFlow-Setup.exe
      - name: Reset the lifecycle sandbox
        shell: powershell
        run: .\scripts\tests\Reset-LifecycleSandbox.ps1
      - name: Test unconfigured clean install and uninstall
        shell: powershell
        run: .\scripts\Test-ReleaseLifecycle.ps1 -InstallerPath .\release\VibeFlow-Setup.exe -NoConfigFixture
      - name: Reset the lifecycle sandbox
        shell: powershell
        run: .\scripts\tests\Reset-LifecycleSandbox.ps1
      - name: Test V1.5 upgrade, second upgrade, and uninstall
        shell: powershell
        run: |
          $previous = Join-Path $env:RUNNER_TEMP "VibeFlow-Setup-v1.5.0.exe"
          $previousChecksums = Join-Path $env:RUNNER_TEMP "SHA256SUMS-v1.5.0.txt"
          Invoke-WebRequest `
            -Uri "https://github.com/richlearntodo-debug/vibe-flow/releases/download/v1.5.0/VibeFlow-Setup.exe" `
            -OutFile $previous
          Invoke-WebRequest `
            -Uri "https://github.com/richlearntodo-debug/vibe-flow/releases/download/v1.5.0/SHA256SUMS.txt" `
            -OutFile $previousChecksums
          $checksumLine = Get-Content -LiteralPath $previousChecksums | Where-Object {
            $_ -match '^([0-9A-Fa-f]{64})\s+\*?VibeFlow-Setup\.exe$'
          } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($checksumLine)) {
            throw "V1.5 checksum manifest does not identify VibeFlow-Setup.exe."
          }
          $expectedPreviousHash = ([regex]::Match($checksumLine, '^[0-9A-Fa-f]{64}')).Value.ToUpperInvariant()
          $actualPreviousHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $previous).Hash
          if ($actualPreviousHash -ne $expectedPreviousHash) {
            throw "V1.5 installer hash mismatch."
          }
          .\scripts\Test-ReleaseLifecycle.ps1 `
            -InstallerPath .\release\VibeFlow-Setup.exe `
            -PreviousInstallerPath $previous
      - name: Remove signing certificate
        if: always()
        shell: powershell
        run: |
          if ($env:VIBE_FLOW_SIGN_PFX -and (Test-Path -LiteralPath $env:VIBE_FLOW_SIGN_PFX)) {
            Remove-Item -LiteralPath $env:VIBE_FLOW_SIGN_PFX -Force
          }
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Vibe-Flow-Windows-v2-candidate
          path: |
            release/VibeFlow-Setup.exe
            release/Vibe-Flow-Windows-x64.zip
            release/SHA256SUMS.txt
