name: 问题反馈
description: 连接、听写、快捷键或界面出现异常
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请先在言灵的“自检”页面处理第一项橙色或红色结果并重新检测，再点击“导出诊断”。诊断包不包含普通录音或识别文字，并会隐藏蓝牙身份、完整设备路径、URL 和应用目标。
  - type: input
    id: version
    attributes:
      label: Vibe Flow 版本
      description: 可在设置页右上角查看，例如 1.5.0。
      placeholder: 1.5.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么
      description: 请说明期望结果和实际结果。
      placeholder: 按住录音键后，我期望……，实际……
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 自检结果与关键日志
      description: 请粘贴自检中的失败项、发生时间和诊断包内对应的脱敏日志；不要粘贴私人转译内容。
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: 转写工具
      options:
        - 微信输入法
        - Typeless
        - 豆包输入法
        - Windows 语音输入
        - 其他工具
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 聚焦输入框
        2. 按住录音键并说话
        3. 松开录音键
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: 当前快捷键 Profile
      description: 快捷键问题请填写首页显示的实际生效 Profile；语音问题可填“不适用”。
      placeholder: 通用导航 / Vibe Coding / 浏览器 AI / Terminal Agent / 不适用
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已检查内容，没有上传不希望公开的录音、识别文字或个人信息。
          required: true
